name = "auth-sync-consumer"
main = "src/index.ts"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8791

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[queues.consumers]]
queue = "auth-db-sync-queue"
max_batch_size = 10
max_batch_timeout = 1  # Fast login sync (1s), messages processed sequentially in consumer
max_retries = 3
dead_letter_queue = "auth-db-sync-dlq"

[[queues.consumers]]
queue = "auth-db-sync-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[queues.consumers]]
queue = "lte-db-sync-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "lte-db-sync-dlq"

[[queues.consumers]]
queue = "lte-db-sync-dlq"
max_batch_size = 10
max_batch_timeout = 5

[env.production]
name = "auth-sync-consumer"

[env.production.vars]
ENVIRONMENT = "production"
SKILLPASSPORT_SYNC_URL = "https://skillpassport.rareminds.in"

