name = "auth-sync-consumer"
main = "src/index.ts"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8791

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[queues.consumers]]
queue = "auth-db-sync-queue"
max_batch_size = 10
max_batch_timeout = 1  # ponytail: Fast login sync (1s), ordering handled by Promise.all in consumer
max_retries = 3
dead_letter_queue = "auth-db-sync-dlq"

[[queues.consumers]]
queue = "auth-db-sync-dlq"
max_batch_size = 10
max_batch_timeout = 5

[vars]
ENVIRONMENT = "production"

[[services]]
binding = "SKILLPASSPORT_SYNC"
service = "skillpassport-sync"
environment = "production"
